name: Seed tree + DSM makespan use case

on:
  push:
    branches: [main]
    paths:
      - kernels/seed_tree.py
      - kernels/dsm_makespan.py
      - kernels/dw_spm.py
      - research/seed_tree_dsm_makespan.py
      - examples/dw_spm_c1_c14_fixture.json
      - examples/seed_tree_dsm_makespan_reference.json
      - tests/test_seed_tree.py
      - .github/workflows/seed-tree.yml
  pull_request:
    paths:
      - kernels/seed_tree.py
      - kernels/dsm_makespan.py
      - kernels/dw_spm.py
      - research/seed_tree_dsm_makespan.py
      - examples/dw_spm_c1_c14_fixture.json
      - examples/seed_tree_dsm_makespan_reference.json
      - tests/test_seed_tree.py
      - .github/workflows/seed-tree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up declared runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install pinned numpy and plotly (release pins)
        run: python -m pip install numpy==2.3.5 plotly==7.0.0
      - name: Run challenges, rebuild the manifest and compare it with the reference
        run: |
          python --version
          python tests/test_seed_tree.py
          python research/seed_tree_dsm_makespan.py --out "$RUNNER_TEMP/seed_tree/manifest.json" --html "$RUNNER_TEMP/seed_tree/seed_tree_dsm_makespan.html"
          cmp "$RUNNER_TEMP/seed_tree/manifest.json" examples/seed_tree_dsm_makespan_reference.json
      - name: Upload the Plotly chart and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed-tree-dsm-makespan
          path: ${{ runner.temp }}/seed_tree/
