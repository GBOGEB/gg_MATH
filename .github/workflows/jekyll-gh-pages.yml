# Builds and deploys the repository root as a Jekyll site to GitHub Pages
# (https://gbogeb.github.io/gg_MATH/), on the JADE deploy contract (DP1..DP10):
# the hub reusable CI runs the Pages contract tests, builds _site ONCE with the
# exact image actions/jekyll-build-pages@v1 runs (pinned by digest), hashes every
# file into jade-manifest.json and uploads it; the hub reusable deploy admits,
# verifies every digest, deploys serialized per environment, reads the served
# files back and uploads a receipt. Pull requests build and test; only main deploys.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: GBOGEB/pipeline-automation-hub/.github/workflows/jade-reusable-ci.yml@77bac410de6b34afa5df665608611ad9e8db5c84
    with:
      python-version: '3.11'
      install: python -m pip install --disable-pip-version-check pytest==9.0.3 PyYAML==6.0.2
      test-runner: pytest
      test-args: -q -p no:cacheprovider tests/test_pages_bundle.py
      min-tests: 3
      # Same image and entrypoint as actions/jekyll-build-pages@v1 (tag v1.0.13),
      # source ./ and destination _site as before, so the served bytes do not change.
      build-command: |
        docker run --rm -v "$PWD:/github/workspace" -w /github/workspace \
          -e GITHUB_WORKSPACE=/github/workspace -e INPUT_SOURCE=./ -e INPUT_DESTINATION=_site \
          -e INPUT_BUILD_REVISION="$GITHUB_SHA" -e INPUT_VERBOSE=false -e INPUT_FUTURE=false -e INPUT_TOKEN="" \
          -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" -e GITHUB_API_URL="$GITHUB_API_URL" \
          ghcr.io/actions/jekyll-build-pages@sha256:6791ebfd912185ed59bfb5fb102664fa872496b79f87ff8b9cfba292a7345041
        sudo chown -R "$(id -u):$(id -g)" _site
        find _site -name '.*' -prune -exec rm -rf {} +
        # Fail closed if the github-pages metadata (title = repo name | description) did not resolve.
        grep -qF '<title>gg_MATH | ' _site/index.html
      artifact-path: _site
      artifact-name: gg-math-jekyll-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: GBOGEB/pipeline-automation-hub/.github/workflows/jade-reusable-deploy.yml@77bac410de6b34afa5df665608611ad9e8db5c84
    with:
      environment: production
      target: pages
      artifact-name: ${{ needs.ci.outputs.artifact-name }}
      manifest-sha256: ${{ needs.ci.outputs.manifest-sha256 }}
      tests-ran: ${{ fromJSON(needs.ci.outputs.tests-ran) }}
