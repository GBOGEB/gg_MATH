name: Consolidation research pilot
on:
  workflow_dispatch:
  pull_request:
    paths: ['research/consolidation_lab.py', '.github/workflows/consolidation-research.yml']
permissions:
  contents: read
jobs:
  numerical-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 plotly==7.0.0
      - run: python research/consolidation_lab.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-research-proof
          path: research/consolidation_output/
