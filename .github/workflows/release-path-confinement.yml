name: Release path confinement

on:
  pull_request:
    branches: [main]
    paths:
      - release/validate_release.py
      - tests/test_release_path_confinement.py
      - .github/workflows/release-path-confinement.yml
  push:
    branches: [main]
    paths:
      - release/validate_release.py
      - tests/test_release_path_confinement.py
      - .github/workflows/release-path-confinement.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: python -m pip install pytest==9.0.3
      - run: python -m pytest -q tests/test_release_path_confinement.py
