name: DSM + makespan kernel

on:
  push:
    branches: [main]
    paths:
      - kernels/dsm_makespan.py
      - kernels/dw_spm.py
      - examples/dw_spm_c1_c14_fixture.json
      - examples/dsm_makespan_c1_c14_reference.json
      - tests/test_dsm_makespan.py
      - .github/workflows/dsm-makespan-kernel.yml
  pull_request:
    paths:
      - kernels/dsm_makespan.py
      - kernels/dw_spm.py
      - examples/dw_spm_c1_c14_fixture.json
      - examples/dsm_makespan_c1_c14_reference.json
      - tests/test_dsm_makespan.py
      - .github/workflows/dsm-makespan-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsm-makespan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up declared runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Run kernel, compare reference, run analytic challenges (no third-party packages)
        run: |
          python --version
          python kernels/dsm_makespan.py --out "$RUNNER_TEMP/dsm_makespan_manifest.json"
          cmp "$RUNNER_TEMP/dsm_makespan_manifest.json" examples/dsm_makespan_c1_c14_reference.json
          python tests/test_dsm_makespan.py
