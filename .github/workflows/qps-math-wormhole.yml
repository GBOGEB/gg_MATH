name: QPS Math Wormhole P4 Contract
on:
  pull_request:
    paths:
      - 'mission/federation/qps_wormhole.py'
      - 'mission/federation/QPS_MATH_WORMHOLE_V1.md'
      - 'tests/test_qps_wormhole.py'
      - 'mission/federation/qps_hop_census.py'
      - 'tests/test_qps_hop_census.py'
      - '.github/workflows/qps-math-wormhole.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-provider:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Negative contracts and invariant suite
        run: python -m unittest discover -s tests -p 'test_qps_wormhole.py' -v
      - name: Test source-bound multi-hop census, authority and spoof rejection
        run: python -m unittest discover -s tests -p 'test_qps_hop_census.py' -v
      - name: Generate deterministic synthetic provider proposal
        run: |
          mkdir -p artifacts/qps_wormhole
          sha="$(git rev-parse HEAD)"
          python mission/federation/qps_wormhole.py propose \
            --source-sha "$sha" \
            --artifact research/MATH_METHOD_DEPENDENCY_GRAPH_v1.yaml \
            --method M04_PCA --population-id SYNTHETIC_METHOD_GRAPH \
            --wave W259 --pulse P4 \
            --out artifacts/qps_wormhole/proposal.json
          python mission/federation/qps_wormhole.py verify \
            --receipt artifacts/qps_wormhole/proposal.json \
            --artifact research/MATH_METHOD_DEPENDENCY_GRAPH_v1.yaml \
            --source-sha "$sha"
      - name: Upload non-promoting source-bound proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gg-math-qps-wormhole-${{ matrix.python-version }}-${{ github.run_id }}
          path: artifacts/qps_wormhole/proposal.json
          if-no-files-found: error
