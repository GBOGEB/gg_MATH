name: QPS BT gg_MATH native parity QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kernels/qps_scenario_parity.py'
      - 'kernels/bradley_terry.py'
      - 'kernels/bt_uncertainty.py'
      - 'kernels/uncertainty.py'
      - 'tests/test_qps_scenario_parity.py'
      - 'tests/test_qps_bt_uncertainty_contract.py'
      - '.github/workflows/qps-bt-parity-qa.yml'
  push:
    branches: [main]
    paths:
      - 'kernels/qps_scenario_parity.py'
      - 'kernels/bradley_terry.py'
      - 'kernels/bt_uncertainty.py'
      - 'kernels/uncertainty.py'
      - 'tests/test_qps_scenario_parity.py'
      - 'tests/test_qps_bt_uncertainty_contract.py'
      - '.github/workflows/qps-bt-parity-qa.yml'
permissions:
  contents: read
jobs:
  bt-parity:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing math dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.3
      - name: Native gg_MATH QPS contract tests
        run: python -m pytest -q tests/test_qps_scenario_parity.py tests/test_qps_bt_uncertainty_contract.py --junitxml=qps-bt-tests.xml
      - name: Bind the native test evidence to exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHON_MATRIX: ${{ matrix.python }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, pathlib, subprocess, sys
          import xml.etree.ElementTree as ET
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['EXPECTED_SHA']
          suites = ET.parse('qps-bt-tests.xml').getroot().iter('testsuite')
          counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for suite in suites:
              for key in counts:
                  counts[key] += int(suite.get(key, 0))
          assert counts['tests'] >= 26 and not any(counts[k] for k in ('failures', 'errors', 'skipped'))
          paths = ['kernels/qps_scenario_parity.py', 'kernels/bradley_terry.py',
                   'kernels/bt_uncertainty.py', 'kernels/uncertainty.py',
                   'tests/test_qps_scenario_parity.py', 'tests/test_qps_bt_uncertainty_contract.py']
          receipt = {
              'schema': 'gg_math.qps_bt_native_test_receipt.v1', 'source_sha': head,
              'source_class': 'SYNTHETIC_RUBRIC_PSEUDOWINS',
              'authority_transfer': False, 'formal_credit_delta': 0,
              'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
              'tests': counts, 'python': sys.version, 'matrix_python': os.environ['PYTHON_MATRIX'],
              'packages': {p: importlib.metadata.version(p) for p in ('numpy', 'scipy', 'pytest')},
              'run_id': os.environ['RUN_ID'], 'run_attempt': os.environ['RUN_ATTEMPT'],
              'scaling_scope': '201 tied synthetic rows at 20100 pairs; 202 and 722 retain budget HOLD; no source-bound 722 qualification',
          }
          pathlib.Path('qps-bt-native-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qps-bt-native-${{ github.event.pull_request.head.sha || github.sha }}-py${{ matrix.python }}
          path: |
            qps-bt-tests.xml
            qps-bt-native-receipt.json
          if-no-files-found: error
