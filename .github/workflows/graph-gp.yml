name: Graph Matérn Gaussian-process reference

on:
  pull_request:
    paths:
      - kernels/graph_gp.py
      - kernels/spectral_graph.py
      - tests/test_graph_gp.py
      - .github/workflows/graph-gp.yml
      - requirements-release.txt
      - release/constraints-release.txt
      - .python-version
  push:
    branches: [main]
    paths:
      - kernels/graph_gp.py
      - kernels/spectral_graph.py
      - tests/test_graph_gp.py
      - .github/workflows/graph-gp.yml
      - requirements-release.txt
      - release/constraints-release.txt
      - .python-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-gp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph-gp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install canonical pinned runtime
        run: python -m pip install -r requirements-release.txt -c release/constraints-release.txt
      - name: Execute graph kernel and holdout challenges
        run: >-
          python -m pytest -q tests/test_graph_gp.py
          --junitxml=graph-gp-tests.xml
          --cov=kernels.graph_gp --cov-branch
          --cov-report=xml:graph-gp-coverage.xml
      - name: Bind successful evidence to source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, pathlib, subprocess, sys
          from defusedxml import ElementTree as ET
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['EXPECTED_SHA']
          paths = ['kernels/graph_gp.py', 'kernels/spectral_graph.py',
                   'tests/test_graph_gp.py', '.github/workflows/graph-gp.yml',
                   'requirements-release.txt', 'release/constraints-release.txt', '.python-version']
          counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for suite in ET.parse('graph-gp-tests.xml').getroot().iter('testsuite'):
              for key in counts:
                  counts[key] += int(suite.get(key, 0))
          assert counts['tests'] >= 70 and not any(counts[k] for k in ('failures', 'errors', 'skipped'))
          receipt = {
              'schema': 'gg_math.graph_gp_test_receipt.v1', 'source_sha': source,
              'source_class': 'SYNTHETIC_NUMERICAL_CONTRACT_TESTS',
              'authority_transfer': False, 'formal_credit_delta': 0, 'engineering_acceptance': False,
              'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
              'junit_sha256': hashlib.sha256(pathlib.Path('graph-gp-tests.xml').read_bytes()).hexdigest(),
              'coverage_sha256': hashlib.sha256(pathlib.Path('graph-gp-coverage.xml').read_bytes()).hexdigest(),
              'tests': counts, 'python': sys.version,
              'packages': {p: importlib.metadata.version(p) for p in ('numpy', 'scipy', 'pytest', 'defusedxml')},
              'matrix_os': os.environ['MATRIX_OS'], 'matrix_python': os.environ['MATRIX_PYTHON'],
              'run_id': os.environ['RUN_ID'], 'run_attempt': os.environ['RUN_ATTEMPT'],
              'artifact_identity': f"graph-gp-{source}-{os.environ['MATRIX_OS']}-py{os.environ['MATRIX_PYTHON']}",
          }
          pathlib.Path('graph-gp-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graph-gp-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            graph-gp-tests.xml
            graph-gp-coverage.xml
            graph-gp-receipt.json
          if-no-files-found: error
