name: Consolidation research pilot
on:
  workflow_dispatch:
  pull_request:
    paths: ['research/consolidation_lab.py', '.github/workflows/consolidation-research.yml']
jobs:
  numerical-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 plotly==7.0.0
      - run: python research/consolidation_lab.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-research-proof
          path: research/consolidation_output/
