name: M02B Math Bunker Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Execute first bounded kernel
        id: probe
        continue-on-error: true
        run: python kernels/bradley_terry.py
      - name: Emit fleet receipt
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python mission/federation/emit_receipt.py \
            --mission M02B \
            --repo GBOGEB/gg_MATH \
            --source-sha "$SOURCE_SHA" \
            --outcome "$PROBE_OUTCOME" \
            --kernel kernels/bradley_terry.py \
            --out mission/receipts/qps-receipt-M02B.json
      - name: Upload fleet receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-receipt-M02B-${{ github.event.pull_request.head.sha || github.sha }}
          path: mission/receipts/qps-receipt-M02B.json
      - name: Enforce probe outcome
        if: always()
        shell: bash
        run: test "${{ steps.probe.outcome }}" = "success"
