name: gg_MATH G3P convergence math reference proof
on:
  pull_request:
    paths:
      - 'kernels/convergence_control.py'
      - 'tests/test_convergence_control.py'
      - 'kernels/visual_engine_bridge.py'
      - 'tests/test_visual_engine_bridge.py'
      - 'mission/federation/W34_VISUAL_BRIDGE_SAMPLE.json'
      - 'tests/test_convergence_control_tail.py'
      - 'tests/test_convergence_waterfall.py'
      - 'mission/federation/coverage_tail_waterfall.py'
      - 'mission/federation/G3P_COVERAGE_TAIL_W33_BASELINE.json'
      - 'mission/federation/G3P_CONVERGENCE_W1_PREFLIGHT_20261017.json'
      - 'mission/federation/convergence_dashboard.py'
      - 'tests/test_convergence_dashboard.py'
      - 'tests/test_g3p_observed_dashboard.py'
      - 'mission/federation/g3p_observed_dashboard.py'
      - 'mission/federation/G3P_OBSERVED_20261017.json'
      - 'tests/qa_convergence_html.py'
      - '.github/workflows/g3p-convergence-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact checkout proof
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install governed math/test dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'coverage==7.13.3' 'plotly==7.0.0'
      - name: Run source-bound negative and estimator tests
        run: |
          set -euo pipefail
          mkdir -p build/convergence
          python -m coverage run --branch --source=kernels.convergence_control -m unittest discover -s tests -p 'test_convergence_control*.py' -v 2>&1 | tee build/convergence/unit.log
          python -m coverage json -o build/convergence/coverage.json
          python -m unittest discover -s tests -p 'test_convergence_waterfall.py' -v 2>&1 | tee build/convergence/waterfall-tests.log
          python -m mission.federation.coverage_tail_waterfall \
            --baseline mission/federation/G3P_COVERAGE_TAIL_W33_BASELINE.json \
            --coverage build/convergence/coverage.json \
            --source kernels/convergence_control.py \
            --out build/convergence \
            --head "$(git rev-parse HEAD)"
          python -m unittest discover -s tests -p 'test_g3p_observed_dashboard.py' -v 2>&1 | tee build/convergence/observed-unit.log
          python - <<'PY'
          import json,pathlib,re,subprocess
          text=pathlib.Path('build/convergence/unit.log').read_text()
          m=re.search(r'Ran (\d+) tests?',text)
          assert m and int(m.group(1))>=52 and re.search(r'^OK$',text,re.M), 'W33 test count/OK guard'
          data=json.loads(pathlib.Path('build/convergence/coverage.json').read_text())
          total=data['totals']
          stmt=total['covered_lines']/total['num_statements']
          branch=total['covered_branches']/total['num_branches']
          assert total['num_branches']>0 and stmt>=0.80 and branch>=0.75, (stmt,branch)
          # W33 measures EXACTLY the historical two-matrix source blob.
          w=json.loads(pathlib.Path('build/convergence/coverage-waterfall.json').read_text())
          assert w['scope_comparable'], 'W33 baseline/source/tool drift requires new cohort'
          assert w['full_target_satisfied_locally'], 'W33 focused branch/statement tail not complete'
          assert total['covered_lines']==total['num_statements']==172
          assert total['covered_branches']==total['num_branches']==84
          assert len(w['gain']['statements_newly_covered'])==15
          assert len(w['gain']['branches_newly_covered'])==15
          assert w['native_terminal_attestation'] is None
          assert w['formal_acceptance']=='HOLD'
          assert pathlib.Path('build/convergence/coverage-waterfall.html').stat().st_size>2000
          print('G3P_W33_FOCUSED_TAIL_TARGET=100_PERCENT_SOURCE_SCOPE_ONLY')
          receipt={'schema':'gg_math.convergence_native_receipt.v1',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'python':'${{ matrix.python }}',
            'tests_run':int(m.group(1)),
            'statement':{'k':total['covered_lines'],'d':total['num_statements']},
            'branch':{'k':total['covered_branches'],'d':total['num_branches']},
            'authority_transfer':False,'main_merge_admission':'HOLD'}
          pathlib.Path('build/convergence/kernel-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('GG_MATH_CONVERGENCE_NATIVE=PASS',receipt)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-math-convergence-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/convergence
          if-no-files-found: warn

  plotly-html:
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact checkout proof
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Plotly/math and browser QA dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'plotly==7.0.0' 'playwright==1.56.0' 'matplotlib==3.10.7'
          python -m playwright install chromium
      - name: Rebuild source-bound Plotly report and static tests
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/convergence/visual
          python -m unittest discover -s tests -p 'test_convergence_dashboard.py' -v 2>&1 | tee build/convergence/visual-tests.log
          python -m mission.federation.convergence_dashboard --source-sha "$EXPECTED" --out build/convergence/g3p-convergence.html
          python -m mission.federation.g3p_observed_dashboard --source-sha "$EXPECTED" --input mission/federation/G3P_OBSERVED_20261017.json --out build/convergence/g3p-observed.html --receipt-out build/convergence/g3p-observed-receipt.json
      - name: Desktop/laptop/mobile browser interactions and screenshot
        run: |
          set -euo pipefail
          python tests/qa_convergence_html.py --html build/convergence/g3p-convergence.html --out-dir build/convergence/visual/
          python tests/qa_convergence_html.py --observed --html build/convergence/g3p-observed.html --out-dir build/convergence/observed-visual/
      - name: W34 source-scoped Plotly / Matplotlib reproducible visual bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/convergence/w34-visual
          python -m unittest discover -s tests -p 'test_visual_engine_bridge.py' -v 2>&1 | tee build/convergence/w34-visual/bridge-tests.log
          python kernels/visual_engine_bridge.py \
            --input mission/federation/W34_VISUAL_BRIDGE_SAMPLE.json \
            --out build/convergence/w34-visual
          python kernels/visual_engine_bridge.py \
            --input mission/federation/W34_VISUAL_BRIDGE_SAMPLE.json \
            --out build/convergence/w34-visual --verify-only
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("build/convergence/w34-visual")
          t=(root/"bridge-tests.log").read_text()
          assert re.search(r"Ran 10 tests",t) and re.search(r"^OK$",t,re.M), "W34_NO_NATIVE_TEST_SUCCESS"
          m=json.loads((root/"manifest.json").read_text())
          assert len(m["files"])==4 and m["native_ci_attestation"] is None
          assert m["merge_admission"]=="HOLD" and m["cross_repository_credit"] is None
          assert m["plotly_mode"]=="OFFLINE_EMBEDDED_BUNDLE_ONCE"
          assert m["matplotlib_mode"]=="AGG_PNG_AND_SVG"
          print(json.dumps({"W34_MATH_VISUAL_FORMATS":len(m["files"]),
                            "tests_executed":10,"owner_acceptance":None,
                            "merge_admission":"HOLD"}))
          PY
      - name: Source-bound QA manifest
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('build/convergence')
          paths=list(root.rglob('*'))
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in paths if p.is_file()}
          exact=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert exact==os.environ['EXPECTED']
          output={'schema':'gg_math.convergence_artifact_manifest.v1',
                  'source_sha':exact,'files_sha256':files,'authority_transfer':False,
                  'merge_admission':'HOLD','test_fixture_only':True}
          (root/'manifest.json').write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          assert 'g3p-convergence.html' in files
          assert len([n for n in files if n.endswith('.png')])==6
          assert 'g3p-observed.html' in files and 'g3p-observed-receipt.json' in files
          observation=json.loads((root/'g3p-observed-receipt.json').read_text())
          assert observation['source_receipt_verification']=='GITHUB_URL_LOCATORS_NOT_CRYPTOGRAPHIC_PROOF'
          assert observation['merge_admission']=='HOLD' and not observation['authority_transfer']
          assert observation['generated_plotly_figures']==9
          print('GG_MATH_PLOTLY_BROWSER_QA=PASS',exact)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg-math-convergence-plotly-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/convergence/
          if-no-files-found: warn
