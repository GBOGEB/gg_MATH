name: LM-10 Signal Stack

on:
  pull_request:
  push:
    branches:
      - mission/v-rmt-spectral-assimilation-v1
      - mission/lm10-w2-p21-core
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signal-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute independent LM-10 reference challenges
        run: |
          set -euo pipefail
          python tests/test_lm10_signal_stack.py | tee lm10_signal_stack.out
          grep -q PASS_LM10_SIGNAL_STACK lm10_signal_stack.out
          python tests/test_lm10_w2_p21_core.py | tee lm10_w2_p21_core.out
          grep -q PASS_LM10_W2_P21_CORE lm10_w2_p21_core.out
      - name: Emit exact-head receipt
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          paths = [pathlib.Path('lm10_signal_stack.out'), pathlib.Path('lm10_w2_p21_core.out')]
          receipt = {
              'schema': 'gg-math-lm10-runtime-receipt/v2',
              'mission_id': 'LM-10',
              'wave': 'W2',
              'pulse': 'P2.1',
              'repository': 'GBOGEB/gg_MATH',
              'sha': os.environ['GITHUB_SHA_VALUE'],
              'steps_gt_0': True,
              'result': 'PASS_REFERENCE_CHALLENGE',
              'covered_hypotheses': ['H01', 'H02', 'H03', 'H04', 'H05', 'H06', 'H07', 'H08'],
              'stdout_sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
              'evidence_class': 'REFERENCE_CHALLENGE',
              'authority_cap': 'A2',
              'authority_transfer': False,
          }
          pathlib.Path('LM10_RUNTIME_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lm10-signal-stack-receipt
          path: |
            lm10_signal_stack.out
            lm10_w2_p21_core.out
            LM10_RUNTIME_RECEIPT.json
