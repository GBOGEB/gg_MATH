name: gg_MATH portfolio longitudinal reference
on:
  pull_request:
    paths:
      - 'kernels/portfolio_longitudinal.py'
      - 'tools/portfolio_longitudinal_cli.py'
      - 'tests/test_portfolio_longitudinal*.py'
      - 'examples/portfolio_longitudinal_reference.json'
      - 'docs/PORTFOLIO_LONGITUDINAL_MIP_V1.md'
      - '.github/workflows/portfolio-longitudinal-reference.yml'
  push:
    branches: [main]
    paths:
      - 'kernels/portfolio_longitudinal.py'
      - 'tools/portfolio_longitudinal_cli.py'
      - 'tests/test_portfolio_longitudinal*.py'
      - 'examples/portfolio_longitudinal_reference.json'
      - '.github/workflows/portfolio-longitudinal-reference.yml'
permissions:
  contents: read
concurrency:
  group: portfolio-longitudinal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governed-reference:
    name: Deterministic math / ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install bounded instrumentation
        run: python -m pip install 'coverage==7.10.7'
      - name: Run contract, negative and branch-coverage tests
        run: |
          set -euo pipefail
          mkdir -p build/portfolio
          python -m coverage run --branch \
            --source=kernels.portfolio_longitudinal,tools.portfolio_longitudinal_cli \
            -m unittest discover -s tests -p 'test_portfolio_longitudinal*.py' -v \
            2>&1 | tee build/portfolio/tests.log
          python -m coverage json -o build/portfolio/coverage.json
          python - <<'PY'
          import json, pathlib, re
          log=pathlib.Path('build/portfolio/tests.log').read_text()
          result=re.search(r'Ran (\d+) tests?', log)
          if not result or int(result.group(1)) < 43 or not re.search(r'^OK$',log,re.M):
              raise SystemExit('HOLD: fewer than 43 passing native contract tests')
          totals=json.loads(pathlib.Path('build/portfolio/coverage.json').read_text())['totals']
          if totals['num_statements'] < 300 or totals['num_branches'] < 100:
              raise SystemExit('HOLD: statement/branch denominators missing')
          if totals['percent_covered'] < 80:
              raise SystemExit('HOLD: branch-aware combined coverage <80%')
          PY
      - name: Rebuild and verify deterministic JSON receipt
        run: |
          set -euo pipefail
          python tools/portfolio_longitudinal_cli.py \
            examples/portfolio_longitudinal_reference.json \
            -o build/portfolio/reference_1.json
          python tools/portfolio_longitudinal_cli.py \
            examples/portfolio_longitudinal_reference.json \
            -o build/portfolio/reference_2.json
          cmp build/portfolio/reference_1.json build/portfolio/reference_2.json
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path('build/portfolio/reference_1.json')
          receipt=json.loads(p.read_text())
          digest=receipt.pop('receipt_sha256')
          canonical=json.dumps(receipt, sort_keys=True, ensure_ascii=False,
                               separators=(',',':'), allow_nan=False).encode()
          if digest!=hashlib.sha256(canonical).hexdigest():
              raise SystemExit('HOLD: receipt digest mismatch')
          if receipt['authority_transfer'] is not False or receipt['accepted_root_closure_credit'] is not None:
              raise SystemExit('HOLD: unsupported authority promotion')
          PY
      - name: Publish test-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: longitudinal-${{ matrix.python }}-${{ github.run_id }}
          path: build/portfolio/
          if-no-files-found: warn

  cross-runtime-receipt:
    name: Cross-runtime receipt parity / Python 3.11 vs 3.12
    needs: governed-reference
    runs-on: ubuntu-latest
    steps:
      - name: Download exact-run matrix receipts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: longitudinal-*-${{ github.run_id }}
          path: build/reconcile
          merge-multiple: false
      - name: Verify source-identical machine-readable outputs
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          rid = os.environ['RUN_ID']
          root = pathlib.Path('build/reconcile')
          base = 'longitudinal-{}-' + rid
          a = root / base.format('3.11') / 'reference_1.json'
          b = root / base.format('3.12') / 'reference_1.json'
          if not a.is_file() or not b.is_file():
              raise SystemExit('HOLD: missing source-bound matrix reference artifact')
          if a.read_bytes() != b.read_bytes():
              raise SystemExit('HOLD: Python 3.11/3.12 receipt bytes diverge')
          d = json.loads(a.read_text())
          digest = d.pop('receipt_sha256')
          canonical = json.dumps(d, sort_keys=True, ensure_ascii=False,
                                 separators=(',', ':'), allow_nan=False).encode()
          if digest != hashlib.sha256(canonical).hexdigest():
              raise SystemExit('HOLD: cross-runtime receipt digest invalid')
          if d.get('output_float_significant_digits') != 14:
              raise SystemExit('HOLD: unexpected numerical report precision')
          if d.get('authority_transfer') is not False or d.get('formal_credit_delta') != 0:
              raise SystemExit('HOLD: unsupported authority or credit')
          for py in ('3.11','3.12'):
              folder = root / base.format(py)
              totals = json.loads((folder / 'coverage.json').read_text())['totals']
              if totals['num_statements'] < 300 or totals['num_branches'] < 100:
                  raise SystemExit('HOLD: missing native coverage denominator')
              if totals['percent_covered'] < 80:
                  raise SystemExit('HOLD: native source coverage below floor')
              if 'Ran 43 tests' not in (folder / 'tests.log').read_text():
                  raise SystemExit('HOLD: matrix behavioral-test count mismatch')
          print('MATRIX_PARITY_VERIFIED', hashlib.sha256(a.read_bytes()).hexdigest())
          PY
