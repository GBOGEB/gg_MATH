name: C14 PCA effective-rank contract
on:
  pull_request:
    paths:
      - 'kernels/pca_effective_rank.py'
      - 'kernels/pca_uncertainty.py'
      - 'tests/test_c14_effective_rank.py'
      - 'tests/test_c14_bootstrap_rank_integration.py'
      - '.github/workflows/c14-pca-effective-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-rank-contract:
    name: C14 (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Source SHA mismatch: $ACTUAL_SHA != $EXPECTED_SHA"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install canonical pinned release runtime
        run: python -m pip install -r requirements-release.txt -c release/constraints-release.txt
      - name: Execute exact standalone and consumer contract tests
        run: >-
          python -m pytest -q
          tests/test_c14_effective_rank.py
          tests/test_c14_bootstrap_rank_integration.py
          --cov=kernels.pca_effective_rank
          --cov=kernels.pca_uncertainty
          --cov-report=term-missing
          --cov-report=xml:c14-coverage.xml
      - name: Emit SHA-bound receipt
        if: always()
        shell: bash
        run: |
          echo "C14 PCA checkout SHA: $(git rev-parse HEAD)"
          echo "C14 PCA event SHA: ${GITHUB_SHA}"
          echo "Job result: ${{ job.status }}"
      - name: Upload targeted coverage receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c14-pca-${{ matrix.os }}-py${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: c14-coverage.xml
          if-no-files-found: warn
