name: Semgrep code scanning

# Supplies the "semgrep" code-scanning results that the math_protect ruleset
# requires alongside CodeQL. Findings go to GitHub code scanning (category
# "semgrep"); the ruleset's alert thresholds decide merge admission.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python (.python-version)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version

      - name: Install pinned Semgrep
        run: python -m pip install 'semgrep==1.180.0'

      - name: Scan
        run: |
          semgrep scan \
            --config p/python \
            --config p/github-actions \
            --config p/secrets \
            --metrics=off \
            --sarif --output semgrep.sarif

      - name: Name the SARIF tool "semgrep" for the ruleset
        # Semgrep reports its driver as "Semgrep OSS"; math_protect matches the
        # code-scanning tool name "semgrep".
        run: |
          jq '.runs[].tool.driver.name = "semgrep"' semgrep.sarif > semgrep.named.sarif
          jq -r '"results: \([.runs[].results[]] | length)"' semgrep.named.sarif

      - name: Upload to code scanning
        if: always() && hashFiles('semgrep.named.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: semgrep.named.sarif
          category: semgrep
