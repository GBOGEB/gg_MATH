name: W3-10 Monte Carlo Breadth

on:
  push:
    branches:
      - main
      - mission/w3-10-monte-carlo
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Execute second kernel and independent analytic challenge
        id: probe
        continue-on-error: true
        run: |
          python kernels/monte_carlo_uncertainty.py
          python tests/test_monte_carlo_reference.py
      - name: Emit W3-10 receipt
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python mission/federation/emit_receipt.py \
            --mission W3-10 \
            --repo GBOGEB/gg_MATH \
            --source-sha "$SOURCE_SHA" \
            --outcome "$PROBE_OUTCOME" \
            --kernel kernels/monte_carlo_uncertainty.py+tests/test_monte_carlo_reference.py \
            --evidence-class VERIFIED_INDEPENDENT_ANALYTIC_CHALLENGE \
            --out mission/receipts/qps-receipt-W3-10.json
      - name: Upload W3-10 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qps-receipt-W3-10-${{ github.event.pull_request.head.sha || github.sha }}
          path: mission/receipts/qps-receipt-W3-10.json
      - name: Enforce probe outcome
        if: always()
        shell: bash
        run: test "${{ steps.probe.outcome }}" = "success"
