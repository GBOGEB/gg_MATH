schema: gg_math.grandmission.crew.v1
mission: GRANDMISSION-I-B-TEMPORAL-PCA-FEDERATION
crew_model: elastic_native_provider_federation
separation_of_powers:
  kernel_engineer_builds_math: true
  receipt_smith_builds_identity_and_clock_contracts: true
  ci_smoker_executes: true
  qa_independently_attests: true
  governor_controls_promotion: true
  consumer_engineer_cannot_redefine_provider_math: true
squads:
  COMMAND:
    Mission_Director:
      primary: hold mission objective, wave sequence, DoD and DoV
      emits: [mission_state, wave_transition, close_or_continue]
    The_Orchestrator:
      primary: select next worker from observed BG/CG and identify duplicate work early
      secondary: choose REUSE, SALVAGE, MERGE, PRUNE or RECURSE after each receipt
      emits: [execution_route, branch_disposition, next_CG]
    Technical_Manager:
      primary: protect mathematical semantics, deterministic fixtures and API coherence
      checks: [eigengap, assignment, sign_alignment, subspace_geometry, effect_direction_vs_magnitude, clock_separation]
      emits: [technical_disposition]
    Integration_Manager:
      primary: control exact-SHA provider/consumer binding and merge sequence
      checks: [repo, sha, tree_sha, schema, test_run, artifact_digest, consumer_pointer]
      emits: [federation_binding, merge_plan]
    Governor:
      primary: enforce authority and noncompensation boundaries
      checks: [authority_transfer_false, formal_credit_delta_zero, hard_gate_compensation_false, consumer_scope]
      emits: [governance_disposition]
  BUILD:
    Kernel_Engineer:
      primary: implement generic numerical kernels only when no tested provider implementation already exists
      secondary: maintain deterministic dependency-light reference behavior
      forbidden: [consumer_authority_logic, QPS_acceptance_logic, duplicate_parallel_API_without_justification]
      emits: [kernel_patch, regression_tests]
    Receipt_Smith:
      primary: construct typed provider receipts and round-trip identity/clock/provenance metadata
      fields: [repo, exact_sha, tree_sha, schema, test_id, k, t, a, wave, pulse, pr, run, release]
      secondary: separate diagnostic evidence from authority state
      emits: [typed_receipt, roundtrip_test]
    Visualizer:
      primary: build outward bounded multidimensional representations from provider diagnostics
      hierarchy:
        D4: 3D_plus_colour_or_slices
        D5: 3D_plus_colour_plus_size_linked_views_preferred
        D6: exploratory_colour_size_shape_or_facet
        D_gt_6: projections_linked_views_parallel_coordinates_grand_tour_subspace_metrics
      primary_large_scale_series: [eigengap, principal_angles, projection_distance, grassmann_distance, aligned_effect]
      emits: [json_compendium, html_compendium, representation_receipt]
    Schema_Doctor:
      primary: repair schema or round-trip defects without changing mathematical meaning
      emits: [schema_patch, compatibility_receipt]
  EXECUTE:
    CI_Smoker:
      primary: execute exact-head deterministic challenge and stop on first real red
      required: [source_sha_assertion, steps_gt_zero, C01_C07, receipt_generation, artifact_upload]
      emits: [runtime_receipt, first_red]
    Geometry_Challenger:
      primary: independently challenge known invariants
      fixtures:
        - pure_sign_flip_zero_motion
        - close_eigenvalue_component_swap
        - internal_rotation_stable_subspace
        - true_subspace_rotation_nonzero_geometry
        - attenuation_without_polarity_reversal
        - irregular_wall_time
        - independent_age_exposure
      emits: [challenge_receipt]
  FEDERATE:
    Provider_Binder:
      primary: freeze exact provider repo/SHA/tree/schema/test/artifact identity
      emits: [provider_manifest]
    Consumer_Engineer:
      primary: bind provider diagnostics into QPS/TRIAGE without copying provider algorithms
      required_preservation: [k, t, a, wave, pulse, pr, run, release]
      required_views: [adjacent_motion, wall_time_rate, exposure_age_rate]
      forbidden: [formal_credit_from_math, failed_AND_gate_compensation, raw_sign_reversal_inference]
      emits: [consumer_binding, QPS_receipt]
    Pruner:
      primary: close duplicate implementation branches once unique deltas are salvaged
      checks: [tree_overlap, API_overlap, unique_files, unique_tests, lineage_recorded]
      emits: [prune_receipt]
  RETURN:
    QA_Officer_Signalman:
      primary: independently attest exact identity, runtime outcome, numerical fixtures and consumer boundary
      required_fields: [starting_heads, ending_heads, PRs, commits, runs, artifacts, numerical_fixtures, authority, DoD, DoV, BD_queue]
      emits: [qa_attestation, message_home]
    Archivist:
      primary: publish recursive execution receipt and refreshed handover only when frontier materially changes
      emits: [recursive_receipt, optional_handover]
worker_routing:
  static_math_missing: Kernel_Engineer
  typed_identity_or_clock_gap: Receipt_Smith
  visual_human_facing_gap: Visualizer
  schema_break: Schema_Doctor
  runtime_unknown: CI_Smoker
  numerical_doubt: Geometry_Challenger
  provider_identity_gap: Provider_Binder
  consumer_integration_gap: Consumer_Engineer
  duplicate_branch: Pruner
  authority_question: Governor
  claim_verification: QA_Officer_Signalman
core_loop: REFRESH_DIFF_REUSE_OR_BUILD_CHALLENGE_BIND_INTEGRATE_PRUNE_ATTEST_RECURSE
