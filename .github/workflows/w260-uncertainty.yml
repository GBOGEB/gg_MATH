name: W260 uncertainty and H05 repair
on:
  pull_request:
    paths:
      - 'kernels/bradley_terry.py'
      - 'kernels/typed_relational_bridge.py'
      - 'kernels/stats_core.py'
      - 'kernels/uncertainty.py'
      - 'tests/test_h05_regressions.py'
      - 'tests/test_w260_uncertainty.py'
      - 'tests/test_w260_prove_receipt.py'
      - 'tests/test_bradley_terry_reference.py'
      - 'tests/test_lm10_h05_typed_relational_bridge.py'
      - 'mission/LM10/w260_prove.py'
      - '.github/workflows/w260-uncertainty.yml'
  push:
    branches: [main]
    paths:
      - 'kernels/**'
      - 'tests/**'
      - 'mission/LM10/w260_prove.py'
      - '.github/workflows/w260-uncertainty.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Assert exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: python mission/LM10/w260_prove.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w260-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/w260/receipt.json
          if-no-files-found: error
