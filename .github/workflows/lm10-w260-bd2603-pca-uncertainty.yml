name: LM-10 W260 BD-260.3 PCA Uncertainty
on:
  pull_request:
    branches: [main]
    paths:
      - 'kernels/pca_uncertainty.py'
      - 'tests/test_lm10_w260_bd2603_pca_uncertainty.py'
      - 'mission/LM10/W260_BD260_3_PCA_UNCERTAINTY_v1.json'
      - 'mission/LM10/w260_bd2603_receipt.py'
      - '.github/workflows/lm10-w260-bd2603-pca-uncertainty.yml'
  push:
    branches: [main]
    paths:
      - 'kernels/pca_uncertainty.py'
      - 'tests/test_lm10_w260_bd2603_pca_uncertainty.py'
      - 'mission/LM10/W260_BD260_3_PCA_UNCERTAINTY_v1.json'
      - 'mission/LM10/w260_bd2603_receipt.py'
      - '.github/workflows/lm10-w260-bd2603-pca-uncertainty.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Execute PCA uncertainty challenges
        run: |
          set -euo pipefail
          python tests/test_lm10_w260_bd2603_pca_uncertainty.py | tee bd2603.out
          grep -q PASS_W260_BD260_3_PCA_UNCERTAINTY bd2603.out
      - name: Emit exact-head receipt
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python mission/LM10/w260_bd2603_receipt.py | tee bd2603_receipt.out
          grep -q PASS_W260_BD260_3_RECEIPT bd2603_receipt.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w260-bd2603-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            bd2603.out
            bd2603_receipt.out
            artifacts/lm10_w260/BD260_3_RUNTIME_RECEIPT.json
          if-no-files-found: error
