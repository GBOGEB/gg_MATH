name: C14 PCA effective-rank contract
on:
  pull_request:
    paths:
      - 'kernels/pca_effective_rank.py'
      - 'tests/test_c14_effective_rank.py'
      - '.github/workflows/c14-pca-effective-rank.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-rank-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "Source SHA mismatch: $ACTUAL_SHA != $EXPECTED_SHA"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Execute exact contract tests
        run: python -m pytest -q tests/test_c14_effective_rank.py
      - name: Emit SHA-bound receipt
        if: always()
        run: |
          echo "C14 PCA checkout SHA: $(git rev-parse HEAD)"
          echo "C14 PCA event SHA: ${GITHUB_SHA}"
          echo "Job result: ${{ job.status }}"
