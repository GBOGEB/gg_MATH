name: DW-SPM source provenance
on:
  pull_request:
    branches: [main]
    paths:
      - kernels/source_manifest_verifier.py
      - kernels/drive_hydration_plan.py
      - kernels/drive_census_validation.py
      - kernels/drive_approval_binding.py
      - kernels/drive_hydration_orchestrator.py
      - evidence/dw_spm/drive_census_candidate_20261116.json
      - tests/test_source_manifest_verifier.py
      - tests/test_drive_hydration_plan.py
      - tests/test_drive_census_validation.py tests/test_drive_hydration_orchestrator.py
      - tests/test_drive_hydration_orchestrator.py
      - .github/workflows/dw-spm-source-provenance.yml
  push:
    branches: [main]
    paths:
      - kernels/source_manifest_verifier.py
      - kernels/drive_hydration_plan.py
      - kernels/drive_census_validation.py
      - kernels/drive_approval_binding.py
      - kernels/drive_hydration_orchestrator.py
      - evidence/dw_spm/drive_census_candidate_20261116.json
      - tests/test_source_manifest_verifier.py
      - tests/test_drive_hydration_plan.py
      - tests/test_drive_census_validation.py
      - tests/test_drive_hydration_orchestrator.py
      - .github/workflows/dw-spm-source-provenance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-negative-canaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up declared runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Run provenance negative canaries
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements-release.txt
          python -m pytest -q tests/test_source_manifest_verifier.py tests/test_drive_hydration_plan.py tests/test_drive_census_validation.py
