provider: GBOGEB/gg_MATH
authority_transfer: false
formal_credit_delta: 0
purpose: >-
  Maintain a broad mathematical development plane above the verified kernel layer.
  Existing topics may advance from core reference material into advanced diagnostics,
  topic deep-dives and stretch research without implying production authority. The
  plane is additive to H01-H11 and preserves exact-head/runtime verification as the
  promotion boundary.

maturity_bands:
  CORE:
    meaning: canonical definitions, identities, assumptions, reference kernel or exact worked example
    promotion_requirement: deterministic reference challenge
  ADVANCED:
    meaning: stronger diagnostics, numerical stability, uncertainty, asymptotics, alternative estimators
    promotion_requirement: cross-check against vetted library or independent formulation
  DEEP_DIVE:
    meaning: topic monograph, regime map, pathological cases, derivations, bridges to adjacent topics
    promotion_requirement: bounded research receipt plus explicit assumptions and failure modes
  STRETCH:
    meaning: exploratory or research frontier; may be incomplete or literature-led
    promotion_requirement: none until converted to a named executable mission

promotion_rules:
  - stretch_todo_is_not_runtime_capability
  - deep_dive_text_is_not_consumer_authority
  - synthetic_or_reference_pass_does_not_create_engineering_acceptance
  - exact_source_sha_and_receipt_required_before_federated_consumption
  - assumptions_validity_domain_and_failure_modes_must_survive_promotion
  - numerical_agreement_without_semantic_equivalence_is_not_sufficient
  - authority_transfer_remains_false_unless_separately_governed

