name: Dependency SPINE Peer Source Census (MATH)
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/dependabot.yaml'
      - 'tools/ci/dependency_spine_peer_scan.py'
      - 'tests/test_dependency_spine_peer_scan.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/dependabot.yaml'
      - 'tools/ci/dependency_spine_peer_scan.py'
      - 'tests/test_dependency_spine_peer_scan.py'
  workflow_dispatch:
  schedule:
    - cron: '49 6 * * 0'
permissions:
  contents: read
concurrency:
  group: dependency-spine-peer-math-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-census:
    name: Exact-head native read-only dependency census
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Native adversarial contract tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m unittest discover -s tests -p test_dependency_spine_peer_scan.py -v
      - name: Emit exact-head peer receipt and verify digests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/dependency_spine_peer_scan.py \
            --repo 'GBOGEB/gg_MATH' --expected-sha "$EXPECTED_HEAD" \
            --out "$RUNNER_TEMP/dependency-spine"
      - name: Retain source-head evidence (not an upgrade-coverage claim)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dep-spine-math-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-spine/
          if-no-files-found: warn
          retention-days: 30
