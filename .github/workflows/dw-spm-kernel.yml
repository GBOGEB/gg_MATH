name: DW-SPM kernel

on:
  push:
    branches: [main]
    paths:
      - kernels/dw_spm.py
      - kernels/bradley_terry.py
      - kernels/pca_reference.py
      - kernels/matrix_core.py
      - kernels/stats_core.py
      - examples/dw_spm_c1_c14_fixture.json
      - examples/dw_spm_c1_c14_reference.json
      - tests/test_dw_spm.py
      - .github/workflows/dw-spm-kernel.yml
  pull_request:
    branches: [main]
    paths:
      - kernels/dw_spm.py
      - kernels/bradley_terry.py
      - kernels/pca_reference.py
      - kernels/matrix_core.py
      - kernels/stats_core.py
      - examples/dw_spm_c1_c14_fixture.json
      - examples/dw_spm_c1_c14_reference.json
      - tests/test_dw_spm.py
      - .github/workflows/dw-spm-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytic-challenge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up declared runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Run kernel and analytic challenges (no third-party packages)
        run: |
          python --version
          python kernels/dw_spm.py --out "$RUNNER_TEMP/dw_spm_manifest.json"
          cmp "$RUNNER_TEMP/dw_spm_manifest.json" examples/dw_spm_c1_c14_reference.json
          python tests/test_dw_spm.py
      - name: MILP oracle (scipy, pinned release requirements)
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements-release.txt
          python -m pytest -q tests/test_dw_spm.py tests/test_bradley_terry_reference.py
