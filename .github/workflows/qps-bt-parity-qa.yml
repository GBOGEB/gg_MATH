name: QPS BT gg_MATH native parity QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kernels/qps_scenario_parity.py'
      - 'tests/test_qps_scenario_parity.py'
      - 'tests/test_qps_bt_uncertainty_contract.py'
      - '.github/workflows/qps-bt-parity-qa.yml'
permissions:
  contents: read
jobs:
  bt-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing math dependencies
        run: python -m pip install numpy scipy
      - name: Native gg_MATH QPS contract tests
        run: python -m unittest discover -s tests -p 'test_qps_*py' -v
