name: DW-SPM independent approval binding
on:
  pull_request:
    branches: [main]
    paths:
      - kernels/drive_approval_binding.py
      - tests/test_drive_approval_binding.py
      - .github/workflows/dw-spm-approval-binding.yml
  push:
    branches: [main]
    paths:
      - kernels/drive_approval_binding.py
      - tests/test_drive_approval_binding.py
      - .github/workflows/dw-spm-approval-binding.yml
permissions:
  contents: read
jobs:
  approval-binding-negative-canaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Run approval binding tests
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements-release.txt
          python -m pytest -q tests/test_drive_approval_binding.py
