name: Plane geometry kernel

on:
  push:
    branches: [main]
    paths:
      - kernels/plane_geometry.py
      - tests/test_plane_geometry.py
      - .github/workflows/plane-geometry-kernel.yml
  pull_request:
    paths:
      - kernels/plane_geometry.py
      - tests/test_plane_geometry.py
      - .github/workflows/plane-geometry-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plane-geometry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up declared runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Run known-answer challenges (no third-party packages)
        run: |
          python --version
          python tests/test_plane_geometry.py
